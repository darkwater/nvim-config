name: Generate demo screenshot

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  demo-screenshot:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            neovim \
            kitty \
            xvfb \
            scrot \
            imagemagick

      - name: Install latest Neovim
        run: |
          set -eux

          curl -fL -o /tmp/nvim-linux-x86_64.tar.gz \
            https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz

          tar -C /tmp -xzf /tmp/nvim-linux-x86_64.tar.gz

          sudo rm -rf /opt/nvim
          sudo mv /tmp/nvim-linux-x86_64 /opt/nvim

          echo "/opt/nvim/bin" >> "$GITHUB_PATH"

      - name: Check Neovim
        run: |
          nvim --version

      - name: Cache fonts
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts
          key: nerd-fonts-hack-v1

      - name: Install Hack Nerd Font
        run: |
          set -eux

          if fc-match "Hack Nerd Font" | grep -qi "Hack"; then
            exit 0
          fi

          mkdir -p ~/.local/share/fonts

          curl -fL -o /tmp/Hack.zip \
            https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Hack.zip

          unzip -o /tmp/Hack.zip -d ~/.local/share/fonts/HackNerdFont

          fc-cache -fv

      - name: Prepare Neovim config
        run: |
          set -eux

          mkdir -p ~/.config
          ln -s "$GITHUB_WORKSPACE" ~/.config/nvim

      - name: Generate screenshot
        run: |
          set -eux

          mkdir -p assets .tmp

          WIDTH=1280
          HEIGHT=800

          Xvfb :99 -screen 0 ${WIDTH}x${HEIGHT}x24 &
          export DISPLAY=:99

          export DARK_CONFIG_NONINTERACTIVE_PLUGINS=true

          timeout 30s \
            kitty \
            --class nvim-demo \
            --override font_family="Hack Nerd Font Mono" \
            --override font_size=12 \
            --override background="#212733" \
            --override cursor_blink_interval=0 \
            --override remember_window_size=no \
            --override initial_window_width=$WIDTH \
            --override initial_window_height=$HEIGHT \
            nvim README.md \
              +'let g:BLINK_DONT_BUILD_FUZZY = v:true' \
              +'lua require("dark-config.demo").demo()'

      - name: Compare with existing screenshot
        id: diff
        run: |
          set -eux

          if [[ ! -f assets/demo.png ]]; then
            cp .tmp/demo-new.png assets/demo.png
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Use fuzz threshold to avoid tiny antialiasing/font-rendering noise.
          diff="$(
            compare \
              -fuzz 1% \
              -metric AE \
              assets/demo.png \
              .tmp/demo-new.png \
              .tmp/demo-diff.png 2>&1 || true
          )"

          echo "Image diff: $diff"

          # Exact same image usually reports 0.
          # For now: any non-zero visual diff replaces the image.
          if echo "$diff" | grep -q "^0\( \|$\)"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No visual changes detected, keeping existing screenshot."
          else
            cp .tmp/demo-new.png assets/demo.png
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Visual changes detected, updated screenshot."
          fi

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshot
          path: .tmp/demo-new.png

      - name: Commit updated screenshot
        if: steps.diff.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: update demo screenshot"
          file_pattern: assets/demo.png

      - name: Notify about commit
        if: steps.diff.outputs.changed == 'true'
        env:
          HERMES_TOKEN: ${{ secrets.HERMES_TOKEN }}
          HERMES_CHAT_ID: ${{ secrets.HERMES_CHAT_ID }}
        run: |
          wget https://github.com/darkwater/hermes/releases/download/v0.0.0-12/hermes-x86_64-linux -O hermes
          chmod +x hermes
          export HERMES_TOKEN="$HERMES_TOKEN"
          export HERMES_CHAT_ID="$HERMES_CHAT_ID"
          ./hermes send --image .tmp/demo-diff.png "nvim-config: updated demo screenshot"
